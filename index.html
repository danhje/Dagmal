<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dagmál</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☀️</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="sky">
  <div class="cloud cloud-1">☁️</div>
  <div class="cloud cloud-2">☁️</div>
  <div class="cloud cloud-3">☁️</div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-sun">☀️</span>
    <div class="brand-text">
      <h1>Dagmál</h1>
      <p>Morning &amp; bedtime adventures</p>
    </div>
  </div>
  <button id="openParents" class="btn btn-parents" type="button">
    <span aria-hidden="true">🔧</span> For parents
  </button>
</header>

<main id="mainView" class="main-view"></main>

<template id="emptyStateTemplate">
  <div class="empty-state">
    <div class="empty-emoji">🌱</div>
    <h2>Nothing planted here yet!</h2>
    <p>Ask a grown-up to tap <strong>For parents</strong> to add kids and routines.</p>
  </div>
</template>

<template id="kidCardTemplate">
  <section class="kid-card">
    <div class="kid-header">
      <span class="kid-avatar"></span>
      <h2 class="kid-name"></h2>
      <div class="kid-progress">
        <div class="kid-progress-bar"><div class="kid-progress-fill"></div></div>
        <span class="kid-progress-label"></span>
      </div>
    </div>
    <div class="kid-ranges"></div>
  </section>
</template>

<template id="rangeBlockTemplate">
  <div class="range-block">
    <h3 class="range-title"></h3>
    <ul class="item-list"></ul>
  </div>
</template>

<template id="itemRowTemplate">
  <li class="item-row">
    <button type="button" class="item-row-btn" aria-pressed="false">
      <span class="item-check">
        <span class="check-mark">✓</span>
      </span>
      <span class="item-text"></span>
    </button>
  </li>
</template>

<template id="dayBannerTemplate">
  <div class="day-banner">
    <span class="day-banner-emoji">⏰</span>
    <span class="day-banner-text"></span>
  </div>
</template>

<!-- Parents panel -->
<div id="parentsOverlay" class="overlay" hidden>
  <div class="parents-panel" role="dialog" aria-modal="true" aria-labelledby="parentsTitle">
    <div class="parents-header">
      <h2 id="parentsTitle">🔧 For parents</h2>
      <button id="closeParents" class="btn-icon" type="button" aria-label="Close">✕</button>
    </div>

    <div class="parents-body">
      <section class="settings-section">
        <div class="settings-section-head">
          <h3>👧🧒 Kids</h3>
          <span class="hint">1–5 kids</span>
        </div>
        <div id="kidsEditor" class="kids-editor"></div>
        <button id="addKid" class="btn btn-add" type="button">+ Add kid</button>
      </section>

      <section class="settings-section">
        <div class="settings-section-head">
          <h3>⏰ Time ranges</h3>
          <span class="hint">1–5 ranges, each with 1–50 to‑dos</span>
        </div>
        <div id="rangesEditor" class="ranges-editor"></div>
        <button id="addRange" class="btn btn-add" type="button">+ Add time range</button>
      </section>
    </div>

    <div class="parents-footer">
      <button id="saveParents" class="btn btn-primary" type="button">Save changes</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
